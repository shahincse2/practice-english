# Gradle JVM
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# CPU has 2 physical cores, so keep Gradle workers low
org.gradle.parallel=false
org.gradle.workers.max=2

# Keep daemon between builds
org.gradle.daemon=true
org.gradle.daemon.idletimeout=600000

# Build cache
org.gradle.caching=true
org.gradle.configureondemand=true

# AndroidX
android.useAndroidX=true

# Flutter template settings
android.newDsl=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
